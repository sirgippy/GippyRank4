name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate site JavaScript
        run: npm run test:js

      - name: Run retained test suite
        run: uv run pytest -q

      - name: Validate published API contract
        run: uv run python -c "from gippyrank.api.app import app; assert app.state.publication_store is not None; assert app.openapi()['info']['version'] == 'v1'"

      - name: Run Ruff
        run: uv run ruff check .

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium browser smoke tests
        run: npm run test:browser

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Check committed diff whitespace
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$DIFF_BASE" "$DIFF_HEAD"

      - name: Check validation side effects
        run: git diff --exit-code

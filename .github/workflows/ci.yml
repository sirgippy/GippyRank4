name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate site JavaScript
        run: npm run test:js

      - name: Run retained test suite
        run: uv run pytest -q

      - name: Build and validate production static API
        run: |
          uv run python scripts/build_site_data.py
          test -s site/api/v1/index.json
          test -s site/api/v1/publications.json
          uv run python -c 'import json; from pathlib import Path; root = Path("site/api/v1"); manifest = json.loads(Path("site/data/manifest.json").read_text()); index = json.loads((root / "index.json").read_text()); inventory = json.loads((root / "publications.json").read_text()); assert index["data"]["publication_count"] == len(manifest["snapshots"]) == inventory["count"]; assert len(inventory["publications"]) == inventory["count"]; assert all((root / item["links"][key]).is_file() for item in inventory["publications"] for key in ("rankings", "weeks", "season_outlook")); print("validated", inventory["count"], "publications")'

      - name: Run Ruff
        run: uv run ruff check .

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium browser smoke tests
        run: npm run test:browser

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Check committed diff whitespace
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$DIFF_BASE" "$DIFF_HEAD"

      - name: Check validation side effects
        run: git diff --exit-code

[project]
name = "gippyrank4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sirgippy", email = "jegipson@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scipy>=1.17.1",
]

[project.scripts]
gippyrank4 = "gippyrank4:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
